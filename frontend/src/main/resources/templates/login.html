<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Manager - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            background: white;
        }
        .btn-primary {
            background-color: #4A5568;
            border: none;
        }
        .btn-primary:hover {
            background-color: #2D3748;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h2 style="color: #2D3748; font-weight: bold;">TaskManager</h2>
        <p class="text-muted">Sign in to your account</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger" role="alert" style="border-left: 4px solid #dc3545;">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert alert-success" role="alert">
        You have been successfully logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label text-muted" style="font-weight: 500;">Username</label>
            <input type="text" class="form-control" id="username" name="username" required placeholder="john_doe">
        </div>
        <div class="mb-4">
            <label for="password" class="form-label text-muted" style="font-weight: 500;">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
    </form>
</div>

</body>
</html>
